name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=10
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379

    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: airplane_mode

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install OS deps
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf libmysqlclient-dev

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/setup.py', '**/pyproject.toml') }}

      - name: Install bench
        run: |
          python -m pip install --upgrade pip
          pip install frappe-bench

      - name: Init bench
        run: |
          bench init --skip-redis-config-generation --frappe-branch version-15 --python "$(which python)" frappe-bench
          mv airplane_mode frappe-bench/apps/airplane_mode

      - name: Configure bench
        working-directory: frappe-bench
        run: |
          bench set-config -g db_host 127.0.0.1
          bench set-config -g db_port 3306
          bench set-config -g redis_cache "redis://127.0.0.1:13000"
          bench set-config -g redis_queue "redis://127.0.0.1:11000"
          bench set-config -g redis_socketio "redis://127.0.0.1:11000"
          sed -i 's/redis/# redis/g' Procfile

      - name: Create test site
        working-directory: frappe-bench
        run: |
          bench new-site test-site \
            --mariadb-root-password root \
            --admin-password admin \
            --no-mariadb-socket
          bench --site test-site install-app airplane_mode
          bench --site test-site set-config developer_mode 1

      - name: Run tests
        working-directory: frappe-bench
        run: bench --site test-site run-tests --app airplane_mode --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: frappe-bench/sites/.coverage
